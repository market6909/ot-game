<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>신입 작업치료사의 첫 번째 환자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* ========== 색상 토큰 ========== */
:root{
  color-scheme:light;
  --bg:#E9EFF5; --surface:#FFFFFF; --surface-2:#F3F6FA; --surface-3:#E4EBF3;
  --ink:#0E1C2F; --ink-2:#3B4B60; --ink-3:#66768B;
  --line:#D2DBE6; --line-2:#B7C4D4;
  --chrome:#0F2A4A; --chrome-2:#183C67; --on-chrome:#FFFFFF; --on-chrome-2:#A7BCD6;
  --navy-ink:#123460;
  --mint:#1DB8A4; --mint-ink:#077668; --mint-soft:#DCF4F0; --mint-line:#93DACF; --on-mint:#04261F;
  --primary:#0F2A4A; --primary-hover:#1C4676; --on-primary:#FFFFFF;
  --ok:#16865A; --ok-soft:#E0F2E9;
  --warn:#B06A05; --warn-soft:#FCEFD9;
  --bad:#C0303B; --bad-soft:#FBE3E5;
  --review:#8A5A06; --review-soft:#FAF1E1; --review-line:#E6D2AA; --review-paper:#FFFDF7;
  --grid:rgba(15,42,74,.07);
  --stamp-blend:multiply;
  --shadow:0 1px 2px rgba(15,42,74,.06),0 6px 20px rgba(15,42,74,.07);
  /* 사원증(실물 카드)은 테마와 관계없이 같은 색 */
  --paper:#FFFFFF; --paper-ink:#0E1C2F; --paper-ink-2:#4A5B70; --paper-photo:#E3ECF5; --paper-photo-ink:#9FB2C8; --paper-slot:#C9D3DF;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-lg:16px; --r:11px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
    --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
    --line:#22344E; --line-2:#344B6B;
    --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
    --navy-ink:#A9C7F0;
    --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
    --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
    --ok:#46C98F; --ok-soft:#0F2E21;
    --warn:#F2A945; --warn-soft:#352610;
    --bad:#FF727B; --bad-soft:#3A161B;
    --review:#EBB862; --review-soft:#2A2113; --review-line:#4A3A1C; --review-paper:#15130E;
    --grid:rgba(255,255,255,.05);
    --stamp-blend:normal;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0A1320; --surface:#101C2C; --surface-2:#152338; --surface-3:#1B2C45;
  --ink:#E7EEF7; --ink-2:#B0BED0; --ink-3:#8292A8;
  --line:#22344E; --line-2:#344B6B;
  --chrome:#060E1A; --chrome-2:#0E1C30; --on-chrome:#FFFFFF; --on-chrome-2:#8EA5C3;
  --navy-ink:#A9C7F0;
  --mint:#2BCDB8; --mint-ink:#62E2D0; --mint-soft:#0E3533; --mint-line:#1E6B62; --on-mint:#03211C;
  --primary:#2BCDB8; --primary-hover:#48DCC8; --on-primary:#03211C;
  --ok:#46C98F; --ok-soft:#0F2E21;
  --warn:#F2A945; --warn-soft:#352610;
  --bad:#FF727B; --bad-soft:#3A161B;
  --review:#EBB862; --review-soft:#2A2113; --review-line:#4A3A1C; --review-paper:#15130E;
  --grid:rgba(255,255,255,.05);
  --stamp-blend:normal;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3);
}

/* ========== 기본 ========== */
*,*::before,*::after{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px,.55vw + 11px,21px);-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.55;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--chrome)}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--mint);outline-offset:3px}
.mono{font-family:var(--mono)}

/* ========== 상단 바 ========== */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--chrome);color:var(--on-chrome)}
.tb-inner{display:flex;align-items:center;gap:1rem;max-width:96rem;margin:0 auto;padding:.5rem clamp(.75rem,2vw,1.25rem);min-height:3.6rem}
.brand{display:flex;align-items:center;gap:.6rem;white-space:nowrap;flex:none}
.brand-mark{width:2.1rem;height:2.1rem;border-radius:.55rem;background:var(--mint);color:var(--on-mint);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.brand-name{display:block;font-weight:700;font-size:.92rem;line-height:1.2}
.brand-sub{display:block;font-size:.7rem;color:var(--on-chrome-2);line-height:1.2}
.steps{display:flex;gap:.3rem;flex:1;justify-content:center;min-width:0;list-style:none;margin:0;padding:0}
.step{display:flex;align-items:center;gap:.45rem;padding:.35rem .65rem .35rem .4rem;border-radius:.55rem;font-size:.8rem;color:var(--on-chrome-2);background:transparent;border:1px solid transparent;white-space:nowrap;cursor:default}
.step .n{font-family:var(--mono);font-weight:600;font-size:.72rem;width:1.55rem;height:1.55rem;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.step .n svg{width:.8rem;height:.8rem}
.step.is-open{cursor:pointer;color:var(--on-chrome)}
.step.is-open:hover{background:rgba(255,255,255,.08)}
.step.is-done .n{background:var(--mint);color:var(--on-mint)}
.step.is-current{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.22);color:var(--on-chrome)}
.step.is-current .n{background:var(--on-chrome);color:var(--chrome)}
.step.is-locked{opacity:.5}
.step .lbl{display:none}
.step.is-current .lbl{display:inline}
.tb-right{display:flex;align-items:center;gap:.5rem;flex:none;margin-left:auto}
.score-pill{position:relative;display:flex;align-items:baseline;gap:.3rem;padding:.35rem .75rem;border-radius:.55rem;background:rgba(255,255,255,.08);font-size:.78rem;color:var(--on-chrome-2)}
.score-pill b{font-family:var(--mono);font-size:1.15rem;color:var(--on-chrome)}
.timer{display:flex;align-items:center;gap:.35rem;font-family:var(--mono);font-size:.95rem;padding:.35rem .4rem;color:var(--on-chrome)}
.ibtn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;height:2.5rem;min-width:2.5rem;padding:0 .6rem;border-radius:.55rem;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:var(--on-chrome);cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap}
.ibtn:hover{background:rgba(255,255,255,.15)}
.ibtn svg{width:1.1rem;height:1.1rem}
.ibtn.pause{background:var(--mint);border-color:var(--mint);color:var(--on-mint)}
.progress{height:4px;background:rgba(255,255,255,.08)}
.progress i{display:block;height:100%;background:var(--mint);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.plus{position:absolute;right:.2rem;top:100%;font-family:var(--mono);font-weight:700;color:var(--mint);font-size:1.05rem;pointer-events:none;animation:plus 1.5s ease-out forwards}
@keyframes plus{0%{opacity:0;transform:translateY(-4px)}15%{opacity:1;transform:translateY(4px)}100%{opacity:0;transform:translateY(24px)}}
@media (max-width:1180px){.step.is-current .lbl{display:none}.step{padding:.35rem}}
@media (max-width:760px){.brand-text,.steps,.ibtn .lbl,.score-pill .of{display:none}.tb-inner{gap:.5rem}}

/* ========== 환자 배너 ========== */
.banner{background:var(--surface);border-bottom:1px solid var(--line)}
.banner[hidden]{display:none}
.bn-inner{max-width:96rem;margin:0 auto;padding:.55rem clamp(.75rem,2vw,1.25rem);display:flex;flex-wrap:wrap;align-items:center;gap:.4rem 1.5rem;font-size:.86rem}
.pt-id{display:flex;align-items:center;gap:.6rem}
.pt-av{width:2.1rem;height:2.1rem;border-radius:50%;background:var(--navy-ink);color:var(--surface);display:grid;place-items:center;font-weight:700;font-size:.9rem}
.pt-id strong{font-size:1.05rem}
.pt-f .l{color:var(--ink-3);font-size:.76rem;margin-right:.4rem}
.tag{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:700;padding:.18rem .5rem;border-radius:.35rem;white-space:nowrap}
.tag.virtual{background:var(--mint-soft);color:var(--mint-ink)}
.tag.book{background:var(--review-soft);color:var(--review);border:1px solid var(--review-line)}
.banner.review{background:var(--review-soft);border-bottom-color:var(--review-line)}
.rv-badge{background:var(--review);color:var(--surface);font-weight:700;font-size:.78rem;padding:.2rem .6rem;border-radius:.35rem}

/* ========== 작업 영역 ========== */
.ws{max-width:96rem;margin:0 auto;padding:1.25rem clamp(.75rem,2vw,1.25rem) 3rem;display:grid;grid-template-columns:minmax(15rem,19rem) minmax(0,1fr);gap:1.25rem;align-items:start}
.ws.full{grid-template-columns:minmax(0,1fr)}
.ws.full .chart{display:none}
@media (max-width:960px){.ws{grid-template-columns:minmax(0,1fr)}}

/* ========== 환자 차트 ========== */
.chart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 4.6rem);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.chart summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.7rem 1rem;background:var(--chrome-2);color:var(--on-chrome)}
.chart summary::-webkit-details-marker{display:none}
.ch-title{font-weight:700;font-size:.95rem}
.ch-no{font-family:var(--mono);font-size:.72rem;color:var(--on-chrome-2)}
.ch-caret{display:grid;transition:transform .2s}
details[open] > summary .ch-caret{transform:rotate(180deg)}
.ch-body{max-height:calc(100dvh - 9.5rem);overflow:auto;padding:.1rem .85rem 1rem}
@media (max-width:960px){.chart{position:static}.ch-body{max-height:none}}
.ch-sec{margin-top:.8rem}
.ch-sec h3{display:flex;align-items:center;justify-content:space-between;gap:.4rem;font-size:.74rem;font-weight:600;color:var(--ink-3);padding-bottom:.3rem;border-bottom:1px solid var(--line);margin-bottom:.15rem}
.ci{display:grid;grid-template-columns:4.9rem minmax(0,1fr);gap:.55rem;padding:.42rem .4rem;border-radius:.35rem;font-size:.82rem;line-height:1.45}
.ci + .ci{border-top:1px dashed var(--line)}
.ci .k{color:var(--ink-3)}
.ci .v{font-weight:500}
.ci.locked .v{color:var(--ink-3);font-weight:400;display:flex;align-items:center;gap:.35rem}
.ci.deferred .v{color:var(--ink-3);font-weight:400}
.ci.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,55%{background:var(--mint-soft);box-shadow:inset 3px 0 0 var(--mint)}100%{background:transparent;box-shadow:inset 3px 0 0 transparent}}
.new,.senior{display:inline-block;font-size:.62rem;font-weight:700;padding:.02rem .34rem;border-radius:.25rem;margin-left:.3rem;vertical-align:.1em;white-space:nowrap}
.new{background:var(--mint);color:var(--on-mint)}
.senior{color:var(--warn);background:var(--warn-soft)}

/* ========== 공통 패널 ========== */
.main{min-width:0}
.main.enter{animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:clamp(1.1rem,2.2vw,1.9rem)}
.mhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:.8rem 1.5rem;margin-bottom:1.1rem}
.mtag{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--mono);font-size:.8rem;font-weight:600;color:var(--mint-ink);background:var(--mint-soft);padding:.2rem .6rem;border-radius:.4rem}
.mtag.dark{background:rgba(255,255,255,.12);color:var(--mint)}
.mhead h1{font-size:clamp(1.5rem,2.4vw,2.1rem);line-height:1.25;margin-top:.45rem;color:var(--navy-ink);letter-spacing:-.015em}
.mmeta{display:flex;flex-wrap:wrap;align-items:center;gap:.5rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;font-size:.78rem;padding:.3rem .7rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.chip.over{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.over b{color:var(--warn)}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:48em}
.h2{font-size:1.3rem;color:var(--navy-ink);line-height:1.35}
.q{font-size:clamp(1.12rem,1.5vw,1.3rem);font-weight:700;line-height:1.4;margin:1.4rem 0 .85rem;color:var(--ink)}
.q small{display:inline-block;margin-left:.4rem;font-size:.75rem;font-weight:600;color:var(--mint-ink);background:var(--mint-soft);padding:.12rem .5rem;border-radius:.3rem;vertical-align:.15em}

/* 선택지 */
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,15.5rem),1fr));gap:.7rem}
.opts.list{grid-template-columns:minmax(0,1fr)}
.opts.three{grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr))}
.opt{position:relative;display:flex;align-items:center;gap:.8rem;width:100%;text-align:left;padding:.85rem 1rem;min-height:4.2rem;border-radius:var(--r);border:2px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:1.02rem;line-height:1.35;cursor:pointer;transition:border-color .15s,background-color .15s,transform .08s}
.opt:hover:not(:disabled){border-color:var(--mint-line)}
.opt:active:not(:disabled){transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.opt .ico{font-size:1.55rem;line-height:1;flex:none;display:grid;place-items:center}
.opt .ot{flex:1;min-width:0}
.opt .ot small{display:block;font-size:.76rem;font-weight:500;color:var(--ink-3);margin-top:.15rem}
.opt .onote{display:block;font-size:.82rem;font-weight:500;color:var(--ink-2);margin-top:.3rem}
.opt .box{flex:none;width:1.6rem;height:1.6rem;border-radius:.4rem;border:2px solid var(--line-2);display:grid;place-items:center;color:var(--on-mint);font-size:.95rem}
.opt.radio .box{border-radius:50%}
.opt[aria-pressed="true"] .box{background:var(--mint);border-color:var(--mint)}
.opt:disabled{cursor:default}
.opt.s-good{border-color:var(--ok);background:var(--ok-soft)}
.opt.s-good .box{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.s-bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.s-bad .box{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt.s-miss{border-style:dashed;border-color:var(--warn);background:var(--surface)}
.opt.s-miss .box{background:transparent;border-color:var(--warn);color:var(--warn)}
.opt.s-dim{opacity:.55;background:var(--surface)}
.kdot{display:block;width:1rem;height:1rem;border-radius:50%;background:currentColor}

/* 피드백 */
.fb{display:grid;gap:.6rem;margin-top:1.3rem}
.fb.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr))}
.fbi{padding:.8rem 1rem;border-radius:var(--r);background:var(--surface-2);border-left:4px solid var(--line-2);font-size:.93rem;color:var(--ink-2)}
.fbi.good{border-left-color:var(--ok)}
.fbi.bad{border-left-color:var(--bad)}
.fbi.miss{border-left-color:var(--warn)}
.fbi-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.3rem .6rem;margin-bottom:.25rem}
.fbi-top b{font-size:1rem;color:var(--ink)}
.fbtag{font-size:.7rem;font-weight:700;padding:.12rem .45rem;border-radius:.3rem;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.fbi.good .fbtag{background:var(--ok-soft);color:var(--ok)}
.fbi.bad .fbtag{background:var(--bad-soft);color:var(--bad)}
.fbi.miss .fbtag{background:var(--warn-soft);color:var(--warn)}
.found{display:flex;gap:.4rem;align-items:flex-start;margin-top:.45rem;color:var(--navy-ink);font-weight:500}
.found svg{flex:none;margin-top:.25em;color:var(--ok)}

/* 하단 동작 영역 */
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem 1rem;margin-top:1.6rem;padding-top:1.1rem;border-top:1px solid var(--line)}
.actions.tight{margin-top:1rem;padding-top:.8rem}
.btnrow{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3.2rem;padding:.65rem 1.4rem;border-radius:.7rem;border:2px solid transparent;font-weight:700;font-size:1.02rem;cursor:pointer;transition:background-color .15s,border-color .15s,transform .08s;white-space:nowrap}
.btn svg{width:1.1em;height:1.1em}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover:not(:disabled){background:var(--primary-hover)}
.btn.mint{background:var(--mint);color:var(--on-mint)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--ink)}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)}
.btn.big{min-height:3.8rem;font-size:1.12rem;padding:.8rem 2rem}
.btn.wide{width:100%;margin-top:1.1rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.88rem;color:var(--ink-3)}
.rstrip{display:flex;align-items:center;gap:1rem;flex:1;min-width:min(100%,18rem)}
.rpts{flex:none;display:flex;align-items:baseline;gap:.25rem;padding:.45rem .85rem;border-radius:.6rem;background:var(--mint-soft);color:var(--mint-ink);font-weight:600;white-space:nowrap}
.rpts b{font-family:var(--mono);font-size:1.5rem}
.rmsg{font-size:.98rem;color:var(--ink-2);font-weight:500}
@media (max-width:560px){.btn{white-space:normal}.actions > .btn,.actions > .btnrow{width:100%}.actions > .btnrow .btn{flex:1}}
.note{display:flex;gap:.6rem;align-items:flex-start;font-size:.86rem;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:.65rem .85rem;margin-top:1rem}
.note svg{flex:none;margin-top:.2em}
.note.rv{background:var(--review-soft);border-color:var(--review-line);color:var(--ink)}
.note.rv svg{color:var(--review)}

/* ========== 시작 화면 ========== */
.start{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:1.25rem}
@media (max-width:960px){.start{grid-template-columns:minmax(0,1fr)}}
.hero{position:relative;overflow:hidden;background:var(--chrome);color:var(--on-chrome);border-radius:var(--r-lg);padding:clamp(1.5rem,3.5vw,2.8rem);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem 2rem;align-items:center;min-height:25rem}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
.hero > *{position:relative}
@media (max-width:720px){.hero{grid-template-columns:minmax(0,1fr)}.idcard{justify-self:center}}
.hero-pills{display:flex;flex-wrap:wrap;gap:.4rem}
.hp{font-size:.78rem;font-weight:600;padding:.25rem .6rem;border-radius:.4rem;background:rgba(255,255,255,.1);color:var(--on-chrome)}

.dc-grid span{font-size:.78rem;color:var(--ink-3);font-weight:600}
.dc-grid b{font-size:1rem;font-weight:600}
.homewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:1.2rem;margin-top:1.1rem;align-items:stretch}
@media (max-width:900px){.homewrap{grid-template-columns:minmax(0,1fr)}}
.house{display:grid;grid-template-columns:1.25fr 1fr;grid-template-rows:minmax(8.5rem,1fr) minmax(8.5rem,1fr) auto;grid-template-areas:"bed bath" "living kitchen" "door door";gap:5px;padding:5px;background:var(--navy-ink);border-radius:12px;min-height:20rem}
.room{position:relative;border:0;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3rem;background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px;color:var(--ink);font-weight:700;cursor:pointer;transition:background-color .15s,box-shadow .15s;padding:.6rem}
.room.static{cursor:default;color:var(--ink-3);font-weight:500}
.room:not(.static):hover{background-color:var(--mint-soft)}
.room[aria-pressed="true"]{background-color:var(--mint-soft);box-shadow:inset 0 0 0 3px var(--mint)}
.r-bed{grid-area:bed}
.r-bath{grid-area:bath}
.r-living{grid-area:living}
.r-kitchen{grid-area:kitchen}
.r-door{grid-area:door;min-height:2.4rem;flex-direction:row;font-size:.82rem}
.room-ico{font-size:2.1rem;line-height:1}
.room-name{font-size:1.02rem}
.room-st{position:absolute;top:.45rem;right:.45rem;width:1.65rem;height:1.65rem;border-radius:50%;display:grid;place-items:center;font-size:.85rem;color:var(--surface);font-weight:700}
.room-st.ok{background:var(--ok)}
.room-st.no{background:var(--bad)}
.room-st.todo{background:var(--warn)}
.scene{border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;background:var(--surface-2);scroll-margin-top:6rem}
.scene.empty{display:grid;place-items:center;text-align:center;color:var(--ink-3);border-style:dashed;min-height:12rem}
.scene h3{display:flex;align-items:center;gap:.5rem;font-size:1.25rem;color:var(--navy-ink)}
.problem{margin:.6rem 0 .9rem;font-size:1.06rem;font-weight:600;padding:.75rem .9rem;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--ink)}

/* ========== 최종 결과 ========== */
.rhero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1.5rem;align-items:center;background:var(--chrome);color:var(--on-chrome);border-radius:var(--r-lg);padding:clamp(1.4rem,3vw,2.4rem)}
.rhero h1{font-size:clamp(1.6rem,3.1vw,2.5rem);line-height:1.25;margin:.7rem 0;letter-spacing:-.015em}
.rtitle{display:inline-block;font-weight:700;color:var(--on-mint);background:var(--mint);padding:.3rem .85rem;border-radius:.45rem}
.rtime{margin-top:.9rem;color:var(--on-chrome-2);display:flex;align-items:center;gap:.4rem;font-size:.95rem}
.rtime b{color:var(--on-chrome)}
.rscore{text-align:right}
.rscore b{display:block;font-family:var(--mono);font-size:clamp(4rem,9vw,6.5rem);line-height:1;color:var(--on-chrome)}
.rscore span{color:var(--on-chrome-2);font-size:1rem}
@media (max-width:720px){.rhero{grid-template-columns:minmax(0,1fr)}.rscore{text-align:left}}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:1.2rem;margin-top:1.2rem}
@media (max-width:1000px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.3rem .8rem;padding:.6rem 0}
.rbar + .rbar{border-top:1px solid var(--line)}
.rbar .nm{font-weight:600;font-size:.92rem}
.rbar .nm small{display:block;font-weight:500;color:var(--ink-3);font-size:.78rem}
.rbar .pt{font-family:var(--mono);font-weight:600;align-self:center}
.rbar .track{grid-column:1/-1;height:.55rem;border-radius:999px;background:var(--surface-3);overflow:hidden}
.rbar .track i{display:block;height:100%;width:0;background:var(--mint);border-radius:inherit;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rsum ol{list-style:none;margin:.8rem 0 0;padding:0;display:grid;gap:.7rem;counter-reset:s}
.rsum li{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.7rem;align-items:start}
.rsum li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--navy-ink);color:var(--surface);font-family:var(--mono);font-weight:600;font-size:.9rem}
.rsum li b{display:block;color:var(--ink)}
.rsum li span{color:var(--ink-2);font-size:.95rem}
.rquote{margin:1.2rem 0 0;padding:clamp(1.2rem,3vw,2rem);border-radius:var(--r-lg);background:var(--mint-soft);border-left:6px solid var(--mint)}
.rquote p{font-size:clamp(1.2rem,2.3vw,1.7rem);font-weight:700;line-height:1.5;color:var(--navy-ink)}

/* ========== 일시정지 / 모달 / 알림 ========== */
.pause-ov{position:fixed;inset:0;z-index:60;background:var(--chrome);color:var(--on-chrome);display:grid;place-items:center;padding:1.5rem;animation:fade .2s ease-out;overflow:auto}
.pause-ov[hidden]{display:none}
.pause-card{text-align:center;display:grid;justify-items:center;gap:1rem;max-width:46rem}
.pause-ic{width:5rem;height:5rem;border-radius:50%;background:var(--mint);color:var(--on-mint);display:grid;place-items:center}
.pause-ic svg{width:2.2rem;height:2.2rem}
.pause-card h2{font-size:clamp(2.2rem,5vw,3.6rem);letter-spacing:-.02em;line-height:1.15}
.pause-card p{font-size:clamp(1.05rem,2vw,1.35rem);color:var(--on-chrome-2)}
.pclock{font-family:var(--mono);font-size:clamp(3rem,9vw,6rem);font-weight:600;line-height:1;min-height:1em}
.pclock.ended{color:var(--warn)}
.pchips{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.pchips button{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.07);color:var(--on-chrome);border-radius:999px;padding:.55rem 1.1rem;font-weight:600;cursor:pointer}
.pchips button:hover{background:rgba(255,255,255,.16)}
.modal-back{position:fixed;inset:0;z-index:70;background:rgba(5,14,26,.58);display:grid;place-items:center;padding:1rem;animation:fade .2s}
.modal{width:100%;max-width:46rem;max-height:calc(100dvh - 2rem);overflow:auto;background:var(--surface);color:var(--ink);border-radius:var(--r-lg);padding:clamp(1.1rem,3vw,1.8rem);box-shadow:0 24px 70px rgba(0,0,0,.4)}
.modal.small{max-width:30rem}
.modal h2{font-size:1.4rem;color:var(--navy-ink)}
.modal h3{font-size:1.02rem;margin:1.3rem 0 .45rem}
.mdesc{color:var(--ink-2);margin-top:.4rem}
.modal .hint{margin-top:.4rem}
.setcase{border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem 1rem;margin:.8rem 0 0;display:grid;gap:.6rem}
.setcase legend{font-weight:700;padding:0 .3rem;font-size:.92rem}
.setcase label{display:grid;gap:.3rem;font-size:.82rem;font-weight:600;color:var(--ink-2)}
.setcase select,.setcase textarea{font:inherit;font-size:.93rem;padding:.55rem .7rem;border-radius:.5rem;border:2px solid var(--line);background:var(--surface);color:var(--ink);width:100%}
.setcase textarea{resize:vertical;line-height:1.5}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toasts{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:grid;gap:.5rem;pointer-events:none;width:max-content;max-width:calc(100% - 2rem)}
.toast{background:var(--chrome);color:var(--on-chrome);padding:.75rem 1.15rem;border-radius:.7rem;font-weight:600;font-size:.94rem;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:toast 2.8s ease forwards;text-align:center}
@keyframes toast{0%{opacity:0;transform:translateY(8px)}10%,85%{opacity:1;transform:none}100%{opacity:0}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;scroll-behavior:auto !important}
}

      opts: [

  ];

  const SUMMARY = [
    ['평가', '증상만 보지 않아요. 근력, 손 기능, 일상생활, 인지, 생활환경까지 확인해요.'],
    ['평가도구', '정답은 하나가 아니에요. 환자의 상태와 목표에 따라 먼저 할 평가를 정해요.'],
    ['수가', '도구나 활동 이름이 아니라 치료시간, 1:1 여부, 치료 내용, 기능 상태로 판단해요.'],
    ['심사', '심사는 기록으로 판단해요. 기록에 없는 치료는 확인될 수 없어요.'],
    ['퇴원', '치료는 집에서 이어져요. 환경, 보조도구, 보호자 교육, 방문재활까지 계획해요.'],
  ];

  /* ================= 고정 설정 ================= */
  const DISCUSS_SEC = 30;

  /* ================= 상태 ================= */
  function freshState(keep) {
    return {
      screen: 'start',
      mode: keep ? keep.mode : 'pair',
      name: keep ? keep.name : '',
      pts: {},
      done: { m1: false, m2: false, m3: false, m4: false, m5: false },
      unlocked: 1,
      chart: {},
      newKeys: new Set(),
      flash: new Set(),
      m1: { sel: new Set(), done: false },
      m2: { active: null, sel: new Set(), done: false },
      m3: { fsel: new Set(), fdone: false, show2: false, choice: null, cdone: false, show3: false, twist: null, tdone: false },
      m4: { phase: 'call', idx: 0, ans: [0, 1, 2].map(() => ({ d: null, r: null })), remain: 30, total: 30, ended: false },
      m5: { intro: false, sel: new Set(), done: false, step: 1, room: null, scene: {}, sdone: false },
      time: { total: 0, per: { m1: 0, m2: 0, m3: 0, m4: 0, m5: 0 } },
      chartOpen: mq('(min-width: 961px)'),
    };
  }
  let S = freshState();
  let lastProgress = 0;

  const total = () => Object.values(S.pts).reduce((a, b) => a + b, 0);
  const mpts = (k) => Object.keys(S.pts).filter((x) => x.startsWith(k)).reduce((a, x) => a + S.pts[x], 0);
  const toggle = (set, k) => { if (set.has(k)) set.delete(k); else set.add(k); };

  function reveal(keys, how) {
    keys.forEach((k) => { S.chart[k] = how || 'revealed'; S.newKeys.add(k); S.flash.add(k); });
  }
  function complete(k) {
    S.done[k] = true;
    const i = MISSIONS.findIndex((m) => m.key === k);
    S.unlocked = Math.max(S.unlocked, i + 2);
    renderTop();
  }
  function award(key, pts) {
    const before = total();
    S.pts[key] = pts;
    countTo($('#scoreNum'), before, total(), 700);
    const pill = $('#scorePill');
    if (pill && pts > 0) {
      const f = document.createElement('span');
      f.className = 'plus';
      f.textContent = '+' + pts;
      pill.appendChild(f);
      setTimeout(() => f.remove(), 1600);
    }
  }
  function countTo(el, from, to, dur) {
    if (!el) return;
    if (reduceMotion || from === to) { el.textContent = String(to); return; }
    const t0 = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - p, 3);
      el.textContent = String(Math.round(from + (to - from) * e));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    $('#toasts').appendChild(t);
    setTimeout(() => t.remove(), 2900);
  }
  function go(screen) {
    S.screen = screen;
    S.newKeys = new Set();
    if (screen === 'm5' && !S.m5.intro) {
      S.m5.intro = true;
      reveal(['dc_home', 'dc_cg', 'dc_issue']);
    }
    renderAll(true);
  }

  /* ================= 공통 조각 ================= */
  function mhead(key, extra) {
    const m = MISSIONS.find((x) => x.key === key);
    return `<header class="mhead">
      <div><span class="mtag">MISSION ${m.no}</span><h1>${m.title}</h1></div>
      <div class="mmeta">${extra || ''}
        <span class="chip">배점 ${m.max}점</span>
      </div>
    </header>`;
  }
  function opt(o) {
    const mark = o.state === 'good' ? ICON.check : o.state === 'bad' ? ICON.x : o.state === 'miss' ? ICON.bang : (o.pressed && !o.state ? ICON.check : '');
    const data = (o.k != null ? ` data-k="${o.k}"` : '') + (o.i != null ? ` data-i="${o.i}"` : '');
    return `<button type="button" class="opt${o.radio ? ' radio' : ''}${o.state ? ' s-' + o.state : ''}" data-act="${o.act}"${data} aria-pressed="${o.pressed ? 'true' : 'false'}"${o.disabled ? ' disabled' : ''}>`
      + (o.icon ? `<span class="ico" aria-hidden="true">${o.icon}</span>` : '')
      + `<span class="ot">${o.label}${o.sub ? `<small>${o.sub}</small>` : ''}${o.note ? `<span class="onote">${o.note}</span>` : ''}</span>`
      + `<span class="box" aria-hidden="true">${mark}</span></button>`;
  }
  const multiState = (done, good, sel) => (done ? (good ? (sel ? 'good' : 'miss') : (sel ? 'bad' : 'dim')) : '');
  const rstrip = (pts, max, msg) => `<div class="rstrip"><span class="rpts"><b>+${pts}</b>점 / ${max}점</span><span class="rmsg">${msg}</span></div>`;
  const nextBtn = (label) => `<button class="btn primary" data-act="next">${label}</button>`;
  const block = (n, title, inner, id) => `<section class="stepblock"${id ? ` id="${id}"` : ''}><div class="sb-head"><span class="sb-n">${n}</span><h2>${title}</h2></div>${inner}</section>`;
  const doneStep = (n, title, pts, max, inner) => `<details class="stepdone"><summary><span class="sb-n">${ICON.check}</span><span>${n}단계: ${title}</span><span class="sd-pts">${pts} / ${max}점</span></summary><div class="sd-body">${inner}</div></details>`;

  /* ================= 상단 바 / 배너 / 차트 ================= */
  function renderTop() {
    const inGame = S.screen !== 'start';
    const fsOK = !!(document.fullscreenEnabled && document.documentElement.requestFullscreen);
    const doneCount = Object.values(S.done).filter(Boolean).length;
    let steps = '';
    if (inGame) {
      steps = '<ol class="steps" aria-label="미션 진행">' + MISSIONS.map((m, i) => {
        const cur = S.screen === m.key;
        const open = i + 1 <= S.unlocked;
        const cls = cur ? 'is-current' : S.done[m.key] ? 'is-done' : open ? '' : 'is-locked';
        const n = S.done[m.key] && !cur ? ICON.check : !open ? ICON.lock : m.no;
        const label = `MISSION ${m.no} ${m.short}${S.done[m.key] ? ' (완료)' : !open ? ' (잠김)' : ''}`;
        const clickable = open && !cur;
        return `<li><button type="button" class="step ${cls}${clickable ? ' is-open' : ''}"${clickable ? ` data-act="goto" data-m="${m.key}"` : ' disabled'} aria-label="${label}"${cur ? ' aria-current="step"' : ''}><span class="n">${n}</span><span class="lbl">${m.short}</span></button></li>`;
      }).join('') + '</ol>';
    }
    const right = inGame
      ? `<div class="score-pill" id="scorePill"><span>점수</span><b id="scoreNum">${total()}</b><span class="of">/ 100</span></div>
         <div class="timer" title="전체 진행 시간">${ICON.clock}<span id="tTotal">${fmt(S.time.total)}</span></div>
         <button type="button" class="ibtn" data-act="restart-ask" aria-label="처음부터 다시 시작">${ICON.restart}</button>`
      : '';
    const fs = fsOK ? `<button type="button" class="ibtn" data-act="full" aria-label="전체 화면">${ICON.full}</button>` : '';
    const prog = doneCount * 20;
    $('#topbar').innerHTML = `<div class="tb-inner">
        <div class="brand"><span class="brand-mark" aria-hidden="true">OT</span><span class="brand-text"><span class="brand-name">미래재활병원 EMR</span><span class="brand-sub">작업치료실</span></span></div>
        ${steps}
        <div class="tb-right">${right}${fs}</div>
      </div>${inGame ? `<div class="progress" aria-hidden="true"><i id="progBar" style="width:${lastProgress}%"></i></div>` : ''}`;
    if (inGame) {
      requestAnimationFrame(() => { const b = $('#progBar'); if (b) b.style.width = prog + '%'; });
      lastProgress = prog;
    } else {
      lastProgress = 0;
    }
  }

  let flashTimer = 0;
  function renderChart() {
    const el = $('#chart');
    const oldBody = el.querySelector('.ch-body');
    const scrollTop = oldBody ? oldBody.scrollTop : 0;
    const body = CHART.map((sec) => {
      const items = sec.items.map((it) => {
        const st = it.always ? 'revealed' : S.chart[it.k];
        const nw = S.newKeys.has(it.k) ? '<span class="new">새 기록</span>' : '';
        const fl = S.flash.has(it.k) ? ' flash' : '';
        if (!st) return `<div class="ci locked"><span class="k">${it.label}</span><span class="v">${ICON.lock}${it.lock || '미확인'}</span></div>`;
        if (st === 'deferred') return `<div class="ci deferred"><span class="k">${it.label}</span><span class="v">다음 회기 평가 예정</span></div>`;
        const sn = st === 'senior' ? '<span class="senior">선배 확인</span>' : '';
        return `<div class="ci${fl}"><span class="k">${it.label}</span><span class="v">${it.value}${nw}${sn}</span></div>`;
      }).join('');
      return `<section class="ch-sec"><h3><span>${sec.sec}</span>${sec.tag ? `<span class="tag virtual">${sec.tag}</span>` : ''}</h3>${items}</section>`;
    }).join('');

    const nb = el.querySelector('.ch-body');
    if (nb) nb.scrollTop = scrollTop;
    $('#chartDetails').addEventListener('toggle', (e) => { S.chartOpen = e.target.open; });

    const st = S.m2;
    let h = mhead('m2');
    h += `<p class="lead">첫 평가 시간은 30분이에요. 모든 검사를 한 번에 할 수는 없어요. 카드를 눌러 각 평가도구를 살펴본 뒤, <b>오늘 먼저 시행할 평가도구 3개</b>를 고르세요.</p>`;
    h += '<div class="toolgrid">' + TOOLS.map((t) => {
      const sel = st.sel.has(t.k), act = st.active === t.k;
      return `<button type="button" class="tool${act ? ' is-active' : ''}${sel ? ' is-sel' : ''}" data-act="m2-view" data-k="${t.k}" aria-pressed="${act}" aria-label="${t.abbr} ${t.name}${sel ? ', 선택됨' : ''}">
        <span class="tool-abbr">${t.abbr}</span><span class="tool-name">${t.name}</span>
        ${sel ? `<span class="tool-badge">${ICON.check}선택</span>` : ''}
        ${st.done ? `<span class="tool-rel rel-${t.pts}">${REL[t.pts]}</span>` : ''}
      </button>`;
    }).join('') + '</div>';
    const t = TOOLS.find((x) => x.k === st.active);
    if (t) {
      const sel = st.sel.has(t.k);
      h += `<section class="tdetail" id="tdetail" aria-live="polite">
        <div class="td-head"><div><span class="td-abbr">${t.abbr}</span><h2>${t.name}</h2><span class="td-en">${t.en}</span></div>
          ${st.done ? '' : `<button type="button" class="btn ${sel ? 'ghost' : 'mint'}" data-act="m2-toggle" data-k="${t.k}">${sel ? '선택 해제' : `${ICON.check} 우선 평가로 선택`}</button>`}
        </div>
        <dl class="td-grid">
          <div><dt><span class="n">1</span>정식 명칭</dt><dd>${t.name} (${t.en})</dd></div>
          <div><dt><span class="n">2</span>평가 목적</dt><dd>${t.purpose}</dd></div>
          <div><dt><span class="n">3</span>이 환자에게 필요한 이유</dt><dd>${t.why}</dd></div>
          <div><dt><span class="n">4</span>임상에서 확인할 수 있는 정보</dt><dd><ul>${t.info.map((i) => `<li>${i}</li>`).join('')}</ul></dd></div>
        </dl>
      </section>`;
    } else {
      h += '<div class="tdetail empty" id="tdetail">위의 평가도구 카드를 눌러 자세한 내용을 확인하세요.</div>';
    }
    if (st.done) {
      const hasHand = st.sel.has('hand'), hasMbi = st.sel.has('mbi');
      let msg;
      if (hasHand && hasMbi) msg = '주호소(숟가락 사용)와 직접 연결되는 상지 기능 평가와 일상생활 평가(MBI)를 모두 골랐어요. 세 번째로 근력(MMT)이나 인지(MMSE)를 고른 것도 모두 타당해요.';
      else if (hasHand || hasMbi) msg = `${hasHand ? '일상생활 평가(MBI)' : '상지 기능 평가'}가 빠졌어요. 이 환자의 주호소와 가장 직접 연결되는 평가예요. 고른 도구들도 이 환자에게 쓸 수 있는 평가이니, 우선순위의 문제예요.`;
      else msg = '근력, 관절, 인지도 중요하지만, 이 환자가 실제로 어려워하는 ‘숟가락 사용’과 ‘일상생활’을 직접 보는 평가가 빠졌어요.';
      h += `<div class="fb">
        <div class="fbi ${hasHand && hasMbi ? 'good' : 'miss'}"><div class="fbi-top"><b>정답이 하나인 문제가 아니에요</b><span class="fbtag">우선순위 판단</span></div><p>${msg}</p></div>
        <div class="fbi"><div class="fbi-top"><b>이 환자에게 각 도구의 우선순위</b></div>
          <div class="prio">${TOOLS.slice().sort((a, b) => b.pts - a.pts).map((x) => `<div><b>${x.abbr}</b><span class="tool-rel rel-${x.pts}">${REL[x.pts]}</span><span>${x.brief}</span></div>`).join('')}</div>
        </div>
      </div>
      <div class="note">${ICON.info}<span>고르지 않은 평가는 다음 회기에 시행할 수 있어요. 오늘의 질문은 ‘무엇을 할까?’가 아니라 ‘무엇을 먼저 할까?’였어요. 선택한 평가의 결과가 차트에 기록됐어요.</span></div>`;
      h += `<div class="actions">${rstrip(S.pts.m2 || 0, 15, hasHand && hasMbi ? '환자의 목표에서 출발한 좋은 우선순위예요.' : '환자의 주호소에서 출발해 우선순위를 정해 봐요.')}${nextBtn('MISSION 3 시작')}</div>`;
    } else {
      h += `<div class="actions"><span class="hint">${st.sel.size} / 3 선택</span><button type="button" class="btn primary" data-act="m2-submit"${st.sel.size === 3 ? '' : ' disabled'}>선택 완료하고 결과 확인</button></div>`;
    }
    return `<div class="panel">${h}</div>`;
  }

  /* ================= MISSION 3 ================= */
  const FEE_TABLE = `<div class="tablewrap"><table class="cmp-table">
    <thead><tr><th scope="col">구분</th>${FEES.map((f, i) => `<th scope="col"${i === 1 ? ' class="col-hit"' : ''}><span class="code">${f.code}</span>${f.name}</th>`).join('')}</tr></thead>
    <tbody>
      <tr><th scope="row">치료사 : 환자</th><td>1명 : 2명 이상 (동시에)</td><td class="col-hit">1명 : 1명</td><td>1명 : 1명</td></tr>
      <tr><th scope="row">치료 시간</th><td>10분 이상</td><td class="col-hit">10분 이상 ~ 30분 정도</td><td>30분 이상</td></tr>
      <tr><th scope="row">치료 방식</th><td>여러 환자를 동시에 훈련</td><td class="col-hit">1:1로 중점적으로 시행</td><td>1:1로 중점적으로 다양한 치료 시행</td></tr>
      <tr class="this"><th scope="row">이번 장면 (1:1, 20분)</th><td>${ICON.x} 1:1이므로 해당 없음</td><td class="col-hit">${ICON.check} 우선 검토</td><td>${ICON.x} 30분 미만</td></tr>
    </tbody></table></div>
    <p class="tnote">교육용으로 요약한 표예요. 실제 급여 인정 여부는 「건강보험 요양급여비용」의 산정기준과 심사기준에 따라 달라질 수 있고, 기준은 개정될 수 있어요.</p>`;

  function feeOpts(act, chosen, done, correct) {
    return FEES.map((f, i) => opt({
      act, i, radio: true, label: `${CIRC[i]} ${f.name}`, sub: f.code, pressed: chosen === i,
      state: done ? (i === correct ? (chosen === i ? 'good' : 'miss') : (chosen === i ? 'bad' : 'dim')) : '',
      disabled: done,
    })).join('');
  }

  function viewM3() {
    const st = S.m3;
    let h = mhead('m3');
    const fOpts = '<div class="opts">' + M3_F.map((o) => opt({ act: 'm3-ftoggle', k: o.k, icon: o.icon, label: o.label, pressed: st.fsel.has(o.k), state: multiState(st.fdone, o.good, st.fsel.has(o.k)), disabled: st.fdone })).join('') + '</div>';
    const fFb = '<div class="fb two">' + M3_F.map((o) => {
      const sel = st.fsel.has(o.k);
      const cls = o.good ? (sel ? 'good' : 'miss') : (sel ? 'bad' : 'skip');
      return `<div class="fbi ${cls}"><div class="fbi-top"><b>${o.icon} ${o.label}</b><span class="fbtag">${o.good ? '확인해야 할 기준' : '판단 기준이 아님'}</span></div><p>${o.why}</p></div>`;
    }).join('') + '</div>';

    // 1단계
    if (!st.fdone) {
      h += `<p class="lead">작업치료에는 여러 종류의 건강보험 수가가 있어요. <b>수가</b>는 건강보험에서 정한 진료 항목별 가격이에요. 수가를 고르기 전에, 무엇을 보고 판단해야 하는지부터 정해요.</p>`;
      h += block(1, '수가를 판단하는 기준 고르기', `<p class="q">작업치료 수가를 판단할 때 무엇을 확인해야 할까요? <small>복수 선택</small></p>${fOpts}
        <div class="actions"><span class="hint">${st.fsel.size}개 선택됨</span><button type="button" class="btn primary" data-act="m3-fsubmit"${st.fsel.size ? '' : ' disabled'}>선택 완료하고 결과 확인</button></div>`);
      return `<div class="panel">${h}</div>`;
    }
    if (!st.show2) {
      h += block(1, '수가를 판단하는 기준 고르기', `${fOpts}${fFb}
        <div class="actions">${rstrip(S.pts.m3f || 0, 8, '이 기준을 들고 실제 치료 장면을 판단해 봐요.')}<button type="button" class="btn primary" data-act="m3-show2">2단계: 치료 장면 보기</button></div>`);
      return `<div class="panel">${h}</div>`;
    }
    h += doneStep(1, '수가를 판단하는 기준', S.pts.m3f || 0, 8, fOpts + fFb);

    // 2단계
    const rec = `<article class="record">
      <div class="rec-head"><span>작업치료 기록지</span><span class="mono">김OO 치료 1일차</span></div>
      <table class="ktable">
        <tr><th scope="row">치료 형태</th><td>치료사 1명 : 환자 1명</td></tr>
        <tr><th scope="row">치료 시간</th><td>20분</td></tr>
        <tr><th scope="row">치료 내용</th><td>우측 손 기능 훈련, 물체 조작 훈련</td></tr>
        <tr><th scope="row">환자 반응</th><td>지시를 이해하고 끝까지 참여함</td></tr>
      </table></article>`;
    let s2 = `<p class="lead">치료사 1명이 환자 1명에게 20분 동안 손 기능과 물체 조작 훈련을 시행했습니다.</p>${rec}
      <p class="q">어떤 작업치료 수가를 우선 검토해야 할까요?</p>
      <div class="opts three">${feeOpts('m3-choose', st.choice, st.cdone, 1)}</div>`;
    if (!st.cdone) {
      s2 += `<div class="actions"><span class="hint">${S.mode === 'solo' ? '근거를 떠올린 뒤 확정하세요' : '짝꿍과 근거를 맞춰 본 뒤 확정하세요'}</span><button type="button" class="btn primary" data-act="m3-csubmit"${st.choice == null ? ' disabled' : ''}>판단 확정</button></div>`;
    } else {
      s2 += `<div class="fb"><div class="fbi ${st.choice === 1 ? 'good' : 'bad'}"><div class="fbi-top"><b>${st.choice === 1 ? '좋은 판단이에요' : '다시 볼까요?'}</b><span class="fbtag">${S.pts.m3c || 0} / 8점</span></div><p>${C2_FB[st.choice]}</p></div></div>
        <p class="keyline">같은 ‘손 기능 훈련’이라도 치료시간, 1:1 여부, 치료 내용, 환자 상태에 따라 검토할 수가가 달라져요. 도구나 활동 이름만으로 정하지 않아요.</p>
        ${FEE_TABLE}`;
      if (!st.show3) s2 += `<div class="actions"><span class="hint">조건을 바꿔 한 번 더 확인해요</span><button type="button" class="btn primary" data-act="m3-show3">3단계: 조건이 바뀐다면?</button></div>`;
    }
    h += block(2, '치료 장면 보고 판단하기', s2, 'step2');

    // 3단계
    if (st.show3) {
      let s3 = `<p class="q">같은 손 기능·물체 조작 훈련을 <u>치료사 1명이 환자 3명에게 동시에 15분</u> 시행했다면, 어떤 수가를 검토할까요?</p>
        <div class="opts three">${feeOpts('m3-twist', st.twist, st.tdone, 0)}</div>`;
      if (!st.tdone) {
        s3 += `<div class="actions"><span class="hint">위의 비교표를 참고해도 좋아요</span><button type="button" class="btn primary" data-act="m3-tsubmit"${st.twist == null ? ' disabled' : ''}>판단 확정</button></div>`;
      } else {
        s3 += `<div class="fb"><div class="fbi ${st.twist === 0 ? 'good' : 'bad'}"><div class="fbi-top"><b>${st.twist === 0 ? '맞아요' : '치료 형태를 다시 보세요'}</b><span class="fbtag">${S.pts.m3t || 0} / 4점</span></div><p>${st.twist === 0 ? '활동은 같아도 치료사 1명이 여러 환자를 동시에 훈련했으니 단순작업치료를 검토해요.' : '활동은 같지만 치료 형태가 1:3으로 바뀌었어요. 치료사 1명이 여러 환자를 동시에 훈련하면 단순작업치료를 검토해요.'}</p></div></div>
          <div class="think">${ICON.bulb}<span><b>생각해 보기</b> 1:1로 35분 동안 다양한 치료를 했다면? 특수작업치료를 검토할 수 있어요. 단, 환자가 30분 넘게 집중해서 참여할 수 있는 상태여야 해요. 이 이야기는 MISSION 4에서 다시 만나요.</span></div>`;
      }
      h += block(3, '조건이 바뀐다면?', s3, 'step3');
    }
    if (st.tdone) {
      const p = mpts('m3');
      const msg = p >= 18 ? '시간, 1:1 여부, 치료 내용을 함께 보는 눈이 생겼어요!' : p >= 12 ? '수가는 활동 이름이 아니라 치료의 조건으로 판단해요.' : '비교표를 다시 보며 시간과 1:1 여부를 짚어 봐요.';
      h += `<div class="actions" id="m3end">${rstrip(p, 20, msg)}${nextBtn('MISSION 4 시작')}</div>`;
    }
    return `<div class="panel">${h}</div>`;
  }

  /* ================= MISSION 4 ================= */
  const cprog = () => `<span class="cprog" aria-label="사례 진행">${CASES.map((c, i) => `<span class="${i === S.m4.idx ? 'cur' : i < S.m4.idx ? 'fin' : ''}">${c.id}</span>`).join('')}</span>`;
  const docCard = (c) => `<article class="doc"><div class="doc-head"><span>심사 대상 청구: 사례 ${c.id}</span></div>
    <table class="ktable">${c.rows.map((r) => `<tr${r.hl ? ' class="hl"' : ''}><th scope="row">${r.th}</th><td>${r.td}</td></tr>`).join('')}</table></article>`;

  function viewM4() {
    const st = S.m4;
    if (st.phase === 'call') {
      return `<div class="panel"><div class="call">
        <div class="phone" aria-hidden="true"><span class="wave"></span><span class="wave w2"></span><span class="wave w3"></span><span class="phone-core">${ICON.phone}</span></div>
        <span class="mtag">MISSION 4</span>
        <div class="caller">건강보험심사평가원</div>
        <div class="caller-sub">작업치료 청구 건 심사 의견 요청</div>
        <p>“선생님, 오늘은 특별 임무가 있어요. 심사위원이 되어, 병원들이 청구한 작업치료와 검사가 적절한지 판단해 주세요.”</p>
        <button type="button" class="btn mint big" data-act="m4-answer">${ICON.phone} 전화 받기</button>
      </div></div>`;
    }
    if (st.phase === 'brief') {
      return `<div class="panel">${mhead('m4')}
        <p class="lead">지금부터 여러분은 <b>심사위원</b>이에요. 병원이 청구한 치료비가 기준과 진료기록에 맞는지 판단해요.</p>
        <div class="note rv">${ICON.bang}<span>지금부터 다루는 3개 사례는 가상 환자 김OO와는 <b>별개의 심사사례</b>예요. 심사 결과는 당시 기준에 따른 것이며, 현행 급여기준과 다를 수 있어요.</span></div>
        <div class="terms">
          <div class="term"><span class="mini k-ok">인정</span><p>청구한 내용을 그대로 인정해요.</p></div>
          <div class="term"><span class="mini k-adj">조정</span><p>기준에 맞게 다른 항목이나 범위로 바꿔서 인정해요.</p></div>
          <div class="term"><span class="mini k-no">불인정</span><p>청구한 내용을 인정하지 않아요.</p></div>
        </div>
        <p class="gloss"><b>청구</b>: 병원이 건강보험에 치료비 지급을 요청하는 것. <b>심사</b>: 청구 내용이 기준과 진료기록에 맞는지 확인하는 것.</p>
        <div class="flow" aria-label="진행 순서"><span>① 판단하기</span><span>② ${S.mode === 'solo' ? '이유 정리' : '짝꿍과 토의'} ${DISCUSS_SEC}초</span><span>③ 심사결과 공개</span></div>
        <div class="actions"><span class="hint">사례 3개, 각 11~12점</span><button type="button" class="btn primary" data-act="m4-start">첫 번째 사례 심사하기</button></div>
      </div>`;
    }
    if (st.phase === 'judge') {
      const c = CASES[st.idx], a = st.ans[st.idx];
      const ready = a.d != null && a.r != null;
      return `<div class="panel">${mhead('m4', cprog())}
        ${docCard(c)}
        <p class="q">① 심사 결정은?</p>
        <div class="opts three">${c.options.map((o, i) => opt({ act: 'm4-dec', i, radio: true, icon: `<span class="kdot k-${o.kind}"></span>`, label: o.label, pressed: a.d === i })).join('')}</div>
        <p class="q">② 가장 중요한 판단 근거는?</p>
        <div class="opts list">${c.reasons.map((r, i) => opt({ act: 'm4-reason', i, radio: true, label: r.t, pressed: a.r === i })).join('')}</div>
        <div class="actions"><span class="hint">${ready ? '좋아요. 이제 이유를 나눠 볼 차례예요.' : '두 가지를 모두 골라 주세요.'}</span><button type="button" class="btn primary" data-act="m4-submit"${ready ? '' : ' disabled'}>판단 완료, ${S.mode === 'solo' ? '이유 정리하기' : '토의하기'}</button></div>
      </div>`;
    }
    if (st.phase === 'discuss') {
      const c = CASES[st.idx], a = st.ans[st.idx];
      const solo = S.mode === 'solo';
      return `<div class="panel">${mhead('m4', cprog())}
        <div class="discuss">
          <div class="dring${st.ended ? ' ended' : ''}"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="trk" cx="60" cy="60" r="54" fill="none" stroke-width="10"/><circle class="bar" id="dRing" cx="60" cy="60" r="54" fill="none" stroke-width="10" stroke-dasharray="339.29" stroke-dashoffset="0"/></svg>
            <div class="dnum"><b id="dNum">${Math.ceil(st.remain)}</b><span>${st.ended ? '토의 끝' : '초 남음'}</span></div></div>
          <div>
            <h2>${solo ? '내 판단의 이유를 정리해요' : '짝꿍과 토의해요'}</h2>
            <p class="dq">“${c.discuss}”</p>
            <div class="mine"><span>${solo ? '나의 판단' : '우리 조의 판단'}</span><b>${c.options[a.d].label}</b><span>판단 근거</span><b>${c.reasons[a.r].t}</b></div>
            <p class="hint dtip">${solo ? '이유를 한 문장으로 소리 내어 말해 보세요.' : '서로 다른 선택을 했다면, 무엇을 근거로 했는지 비교해 보세요.'}</p>
            <div class="dact"><button type="button" class="btn ghost" data-act="m4-add">+10초</button><button type="button" class="btn primary${st.ended ? ' pulse' : ''}" data-act="m4-reveal">심사 결과 공개</button></div>
          </div>
        </div>
      </div>`;
    }
    if (st.phase === 'reveal') {
      const c = CASES[st.idx], a = st.ans[st.idx];
      const ansI = c.answer;
      const o = c.options[ansI];
      const okD = a.d === ansI, okR = c.reasons[a.r].ok;
      const got = S.pts['m4' + c.id] || 0;
      const msg = okD && okR ? '심사위원다운 판단이에요!' : okD || okR ? '절반은 맞혔어요. 판단 근거를 다시 짚어 봐요.' : '괜찮아요. 해설의 판단 흐름을 따라가 봐요.';
      return `<div class="panel">${mhead('m4', cprog())}
        <div class="reveal">
          <div class="paper thud">
            <div class="paper-head">심사 결과 통보: 사례 ${c.id}</div>
            <div class="pl"><span>청구</span><b>${c.claim}</b></div>
            <div class="pl"><span>결정</span><b>${o.label}</b></div>
            <div class="stamp k-${o.kind}" role="img" aria-label="심사결과 ${o.stamp}"><span class="st-top">건강보험 심사</span><span class="st-main">${o.stamp}</span><span class="st-sub">${o.sub || '심사결과'}</span></div>
          </div>
          <div class="reveal-body">
            <div class="official k-${o.kind}"><span class="l">심사결과</span><b>${o.label}</b></div>
            <div class="cmpr ${okD ? 'ok' : 'no'}"><span class="l">${S.mode === 'solo' ? '나의 판단' : '우리 판단'}</span><b>${c.options[a.d].label}</b><span class="m">${okD ? ICON.check + ' 일치' : ICON.x + ' 다름'}</span></div>
            <div class="cmpr ${okR ? 'ok' : 'no'}"><span class="l">판단 근거</span><b>${c.reasons[a.r].t}</b><span class="m">${okR ? ICON.check + ' 핵심 근거' : ICON.x + ' 다시 보기'}</span></div>
            ${okR ? '' : `<p class="fix">핵심 근거: <b>${c.reasons.find((r) => r.ok).t}</b></p>`}
            <h3>왜 이렇게 판단했을까?</h3>
            <div class="explain">${paras(c.explain)}</div>
            <div class="takeaway">${ICON.bulb}<span>${c.takeaway}</span></div>
            <p class="src">당시 심사 기준에 따른 결과로, 현행 급여기준과 다를 수 있어요.</p>
          </div>
        </div>
        <div class="actions">${rstrip(got, c.dpts + 5, msg)}<button type="button" class="btn primary" data-act="m4-next">${st.idx < CASES.length - 1 ? '다음 사례 심사하기' : '심사 정리 보기'}</button></div>
      </div>`;
    }
    // summary
    const p = mpts('m4');
    const msg = p >= 30 ? '기록을 근거로 판단하는 심사위원의 시선을 갖췄어요!' : p >= 20 ? '좋아요. 기록과 환자 상태를 근거로 판단하는 연습을 이어 가요.' : '괜찮아요. 핵심은 ‘기록에 무엇이 남아 있는가’예요.';
    return `<div class="panel">${mhead('m4')}
      <h2 class="h2">세 사례 모두, 심사의 출발점은 ‘기록’이었어요</h2>
      <div class="sumcards">${CASES.map((c) => { const o = c.options[c.answer]; return `<div class="sumcard"><span class="id">사례 ${c.id}</span><span class="mini k-${o.kind}">${o.stamp}</span><b>${c.title}</b><p>${c.takeaway}</p></div>`; }).join('')}</div>
      <div class="recordlist"><h3>작업치료사가 기록에 꼭 남겨야 할 것</h3><ul>
        <li>치료 시간과 치료 형태(1:1 여부)</li><li>실제로 시행한 치료 내용과 사용한 도구</li><li>치료 중 환자의 반응과 참여 정도</li><li>이 치료·검사가 필요한 이유와 기능 변화</li>
      </ul></div>
      <div class="actions">${rstrip(p, 35, msg)}${nextBtn('MISSION 5 시작')}</div>
    </div>`;
  }

  /* ================= MISSION 5 ================= */
  function roomBtn(k, cls) {
    const sc = SCENES.find((s) => s.k === k), r = S.m5.scene[k];
    const mark = r && r.done
      ? (sc.opts[r.pick].ok ? `<span class="room-st ok">${ICON.check}</span>` : `<span class="room-st no">${ICON.x}</span>`)
      : '<span class="room-st todo">!</span>';
    return `<button type="button" class="room ${cls}" data-act="m5-room" data-k="${k}" aria-pressed="${S.m5.room === k}" aria-label="${sc.room}${r && r.done ? ' (확인 완료)' : ''}"><span class="room-ico" aria-hidden="true">${sc.icon}</span><span class="room-name">${sc.room}</span>${mark}</button>`;
  }
  function sceneHTML(k) {
    const sc = SCENES.find((s) => s.k === k);
    const r = S.m5.scene[k] || { pick: null, done: false };
    return `<h3><span aria-hidden="true">${sc.icon}</span>${sc.room}</h3>
      <p class="problem">${sc.problem}</p>
      <div class="opts list">${sc.opts.map((o, i) => opt({ act: 'm5-pick', i, radio: true, label: o.t, note: r.done && !o.ok ? o.n : '', pressed: r.pick === i, state: r.done ? (o.ok ? (r.pick === i ? 'good' : 'miss') : (r.pick === i ? 'bad' : 'dim')) : '', disabled: r.done })).join('')}</div>
      ${r.done ? `<div class="takeaway">${ICON.bulb}<span>${sc.fb}</span></div>` : `<div class="actions tight"><span class="hint">고른 뒤 확인을 눌러요</span><button type="button" class="btn primary" data-act="m5-check"${r.pick == null ? ' disabled' : ''}>확인</button></div>`}`;
  }
  function viewM5() {
    const st = S.m5;
    let h = mhead('m5');
    if (st.step === 1) {
      h += `<div class="dcbrief"><div class="dc-head"><span>퇴원 전 회의 기록</span><span class="mono">퇴원 3일 전</span></div>
        <div class="dc-grid">
          <div><span>집 구조</span><b>아파트(엘리베이터 있음), 욕실 문턱 있음</b></div>
          <div><span>함께 사는 사람</span><b>배우자(75세), 허리가 좋지 않아 힘쓰는 도움이 어려움</b></div>
          <div><span>남은 어려움</span><b>식사, 화장실 이용, 이동</b></div>
        </div></div>
        <p class="q">퇴원 후 김OO 님에게 필요한 지원을 모두 고르세요. <small>복수 선택</small></p>
        <div class="opts">${M5_OPTS.map((o) => opt({ act: 'm5-toggle', k: o.k, icon: o.icon, label: o.label, pressed: st.sel.has(o.k), state: multiState(st.done, o.good, st.sel.has(o.k)), disabled: st.done })).join('')}</div>`;
      if (st.done) {
        h += '<div class="fb two">' + M5_OPTS.map((o) => {
          const sel = st.sel.has(o.k);
          const cls = o.good ? (sel ? 'good' : 'miss') : (sel ? 'bad' : 'skip');
          const tag = o.good ? (sel ? '필요한 지원' : '놓친 지원') : (sel ? '다시 생각해 봐요' : '잘 걸러냈어요');
          return `<div class="fbi ${cls}"><div class="fbi-top"><b>${o.icon} ${o.label}</b><span class="fbtag">${tag}</span></div><p>${o.why}</p></div>`;
        }).join('') + '</div>';
        h += `<div class="actions">${rstrip(S.pts.m5s || 0, 10, '이제 김OO 님의 집 안을 직접 상상해 볼 차례예요.')}<button type="button" class="btn primary" data-act="m5-house">집 안 둘러보기</button></div>`;
      } else {
        h += `<div class="actions"><span class="hint">${st.sel.size}개 선택됨</span><button type="button" class="btn primary" data-act="m5-submit"${st.sel.size ? '' : ' disabled'}>선택 완료하고 결과 확인</button></div>`;
      }
      return `<div class="panel">${h}</div>`;
    }
    const cnt = SCENES.filter((s) => st.scene[s.k] && st.scene[s.k].done).length;
    h += `<p class="lead">김OO 님이 집에 돌아왔어요. 평면도에서 방을 눌러 생활 장면을 확인하고, 가장 알맞은 지원을 고르세요.</p>
      <div class="homewrap">
        <div class="house" role="group" aria-label="김OO 님 집 평면도">
          ${roomBtn('bed', 'r-bed')}${roomBtn('bath', 'r-bath')}
          <div class="room static r-living"><span class="room-name">거실</span></div>
          ${roomBtn('meal', 'r-kitchen')}
          <div class="room static r-door"><span>현관</span></div>
        </div>
        <div class="scene${st.room ? '' : ' empty'}" id="scenePanel">${st.room ? sceneHTML(st.room) : '<p>평면도에서 방을 눌러 보세요.<br>세 곳을 모두 확인하면 미션이 끝나요.</p>'}</div>
      </div>`;
    if (st.sdone) {
      const p = mpts('m5');
      const msg = p >= 13 ? '병원 밖의 생활까지 내다보는 계획이에요!' : p >= 9 ? '좋아요. 환경과 보호자까지 함께 생각해 봐요.' : '치료는 집에서 이어진다는 것을 기억해요.';
      h += `<div class="actions">${rstrip(p, 15, msg)}<button type="button" class="btn primary big" data-act="to-result">최종 결과 보기</button></div>`;
    } else {
      h += `<div class="actions"><span class="hint">${cnt} / 3 장면 완료</span>${cnt > 0 && cnt < 3 ? '<span class="hint">남은 방(! 표시)도 눌러 보세요.</span>' : ''}</div>`;
    }
    return `<div class="panel">${h}</div>`;
  }

  /* ================= 최종 결과 ================= */
  function viewResult() {
    const t = total();
    const title = t >= 90 ? '믿고 맡길 수 있는 신입 작업치료사' : t >= 75 ? '든든한 신입 작업치료사' : t >= 60 ? '쑥쑥 성장 중인 신입 작업치료사' : '선배와 함께 복습하는 신입 작업치료사';
    const nm = S.name.trim();
    return `<section class="result">
      <div class="rhero">
        <div>
          <span class="mtag dark">근무 1일차 종료</span>
          <h1>${nm ? esc(nm) + ' 선생님의' : '오늘 만난'} 첫 번째 환자,<br>김OO 님이 무사히 퇴원했어요</h1>
          <span class="rtitle">${title}</span>
          <p class="rtime">${ICON.clock} 총 진행 시간 <b class="mono">${fmt(S.time.total)}</b></p>
        </div>
        <div class="rscore" aria-label="총점 ${t}점"><b id="countUp">0</b><span>/ 100점</span></div>
      </div>
      <div class="rgrid">
        <div class="panel"><h2 class="h2">미션별 점수</h2>${MISSIONS.map((m) => { const p = mpts(m.key); return `<div class="rbar"><span class="nm">MISSION ${m.no}<small>${m.title}</small></span><span class="pt">${p} / ${m.max}</span><span class="track"><i data-w="${Math.round((p / m.max) * 100)}"></i></span></div>`; }).join('')}</div>
        <div class="panel rsum"><h2 class="h2">오늘 기억할 다섯 가지</h2><ol>${SUMMARY.map((s) => `<li><div><b>${s[0]}</b><span>${s[1]}</span></div></li>`).join('')}</ol></div>
      </div>
      <blockquote class="rquote"><p>“작업치료사는 환자를 평가하고 치료할 뿐 아니라, 치료의 적절성과 필요성을 판단하고 이를 정확하게 기록해야 한다.”</p></blockquote>
      <div class="actions"><span class="hint">가상 환자 사례와 심사사례로 만든 학습용 게임이에요.</span><button type="button" class="btn primary big" data-act="restart-ask">${ICON.restart} 처음부터 다시 하기</button></div>
    </section>`;
  }

  /* ================= 렌더링 ================= */
  function sig(el) {
    if (!el || !el.dataset || !el.dataset.act) return null;
    return [el.dataset.act, el.dataset.k || '', el.dataset.i || '', el.dataset.m || ''].join('|');
  }
  function restoreFocus(s) {
    if (!s) return;
    const [a, k, i, m] = s.split('|');
    const sel = `[data-act="${a}"]` + (k ? `[data-k="${k}"]` : '') + (i ? `[data-i="${i}"]` : '') + (m ? `[data-m="${m}"]` : '');
    const el = document.querySelector(sel);
    if (el && !el.disabled) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } }
  }
  function renderAll(anim) { renderTop(); renderBanner(); renderChart(); renderMain(anim); }
  function renderMain(anim, scrollId) {
    const main = $('#main');
    const focusSig = anim ? null : sig(document.activeElement);
    const y = window.scrollY;
    $('#ws').classList.toggle('full', S.screen === 'start' || S.screen === 'm4');
    const views = { start: viewStart, m1: viewM1, m2: viewM2, m3: viewM3, m4: viewM4, m5: viewM5, result: viewResult };
    main.innerHTML = (views[S.screen] || viewStart)();
    if (anim) {
      main.classList.remove('enter');
      void main.offsetWidth;
      main.classList.add('enter');
      window.scrollTo(0, 0);
    } else {
      window.scrollTo(0, y);
      restoreFocus(focusSig);
    }
    if (scrollId) {
      const t = document.getElementById(scrollId);
      if (t) requestAnimationFrame(() => t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' }));
    }
    if (S.screen === 'result' && anim) {
      countTo($('#countUp'), 0, total(), 1400);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        document.querySelectorAll('.track i').forEach((i) => { i.style.width = i.dataset.w + '%'; });
      }));
    } else if (S.screen === 'result') {
      const c = $('#countUp'); if (c) c.textContent = String(total());
      document.querySelectorAll('.track i').forEach((i) => { i.style.width = i.dataset.w + '%'; });
    }
    if (S.screen === 'm4' && S.m4.phase === 'discuss') updateDiscuss();
  }

  function updateTimers() {
    const tt = $('#tTotal'); if (tt) tt.textContent = fmt(S.time.total);
  }
  function updateDiscuss() {
    const n = $('#dNum'), ring = $('#dRing');
    if (!n || !ring) return;
    n.textContent = String(Math.ceil(S.m4.remain));
    const frac = S.m4.total ? S.m4.remain / S.m4.total : 0;
    ring.style.strokeDashoffset = String(339.29 * (1 - frac));
  }

  let last = performance.now();
  function tick() {
    const now = performance.now();
    const dt = Math.min(2, (now - last) / 1000);
    last = now;
    if (S.time.per[S.screen] != null) {
      S.time.total += dt;
      S.time.per[S.screen] += dt;
      updateTimers();
    }
    if (S.screen === 'm4' && S.m4.phase === 'discuss' && !S.m4.ended) {
      S.m4.remain = Math.max(0, S.m4.remain - dt);
      updateDiscuss();
      if (S.m4.remain <= 0) { S.m4.ended = true; renderMain(false); }
    }
  }

  /* ================= 모달 ================= */
  function openModal(html, cls) {
    const prev = $('#modalBack'); if (prev) prev.remove();
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.id = 'modalBack';
    back.innerHTML = `<div class="modal${cls ? ' ' + cls : ''}" role="dialog" aria-modal="true">${html}</div>`;
    back.addEventListener('click', (e) => { if (e.target === back) closeModal(); });
    document.body.appendChild(back);
    const f = back.querySelector('[data-autofocus]') || back.querySelector('button, select, textarea, input');
    if (f) f.focus();
  }
  function closeModal() { const m = $('#modalBack'); if (m) m.remove(); }

  /* ================= 동작 ================= */
  const A = {
    start() { go('m1'); },
    mode(el) { S.mode = el.dataset.v; renderMain(false); },
    goto(el) { go(el.dataset.m); },
    next() {
      const i = MISSIONS.findIndex((m) => m.key === S.screen);
      go(i >= 0 && i < MISSIONS.length - 1 ? MISSIONS[i + 1].key : 'result');
    },
    'to-result'() { go('result'); },

    full() {
      if (!document.fullscreenElement) {
        const p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(() => toast('이 화면에서는 전체 화면을 열 수 없어요. 브라우저의 F11 키를 사용해 보세요.'));
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    },
    'restart-ask'() {
      openModal(`<h2>처음부터 다시 시작할까요?</h2><p class="mdesc">점수와 진행 상황이 모두 초기화돼요.</p>
        <div class="actions"><button type="button" class="btn ghost" data-act="modal-close" data-autofocus>취소</button><button type="button" class="btn primary" data-act="restart-confirm">${ICON.restart} 다시 시작</button></div>`, 'small');
    },
    'restart-confirm'() {
      S = freshState({ mode: S.mode, name: S.name });
      closeModal();
      renderAll(true);
    },
    'modal-close'() { closeModal(); },

    /* MISSION 1 */
    'm1-toggle'(el) { if (S.m1.done) return; toggle(S.m1.sel, el.dataset.k); renderMain(false); },
    'm1-submit'() {
      const st = S.m1;
      if (st.done || !st.sel.size) return;
      st.done = true;
      const good = M1_OPTS.filter((o) => o.good);
      reveal(good.filter((o) => st.sel.has(o.k)).map((o) => o.k));
      reveal(good.filter((o) => !st.sel.has(o.k)).map((o) => o.k), 'senior');
      let s = 0;
      M1_OPTS.forEach((o) => { if (st.sel.has(o.k)) s += o.good ? 3 : -3; });
      complete('m1');
      award('m1', clamp(s, 0, 15));
      renderChart();
      renderMain(false);
    },

    /* MISSION 2 */
    'm2-view'(el) { S.m2.active = el.dataset.k; renderMain(false, mq('(max-width: 860px)') ? 'tdetail' : null); },
    'm2-toggle'(el) {
      const st = S.m2;
      if (st.done) return;
      const k = el.dataset.k;
      if (st.sel.has(k)) st.sel.delete(k);
      else if (st.sel.size >= 3) { toast('3개까지 고를 수 있어요. 다른 도구를 먼저 해제하세요.'); return; }
      else st.sel.add(k);
      renderMain(false);
    },
    'm2-submit'() {
      const st = S.m2;
      if (st.done || st.sel.size !== 3) return;
      st.done = true;
      TOOLS.forEach((t) => { if (st.sel.has(t.k)) reveal(['t_' + t.k]); else S.chart['t_' + t.k] = 'deferred'; });
      const sum = [...st.sel].reduce((a, k) => a + TOOLS.find((t) => t.k === k).pts, 0);
      complete('m2');
      award('m2', Math.min(15, Math.round((sum / 13) * 15)));
      renderChart();
      renderMain(false);
    },

    /* MISSION 3 */
    'm3-ftoggle'(el) { if (S.m3.fdone) return; toggle(S.m3.fsel, el.dataset.k); renderMain(false); },
    'm3-fsubmit'() {
      const st = S.m3;
      if (st.fdone || !st.fsel.size) return;
      st.fdone = true;
      let s = 0;
      M3_F.forEach((o) => { if (st.fsel.has(o.k)) s += o.good ? 2 : -2; });
      award('m3f', clamp(s, 0, 8));
      renderMain(false);
    },
    'm3-show2'() { S.m3.show2 = true; renderMain(false, 'step2'); },
    'm3-choose'(el) { if (S.m3.cdone) return; S.m3.choice = Number(el.dataset.i); renderMain(false); },
    'm3-csubmit'() {
      const st = S.m3;
      if (st.cdone || st.choice == null) return;
      st.cdone = true;
      award('m3c', [2, 8, 3][st.choice]);
      reveal(['tx']);
      renderChart();
      renderMain(false);
    },
    'm3-show3'() { S.m3.show3 = true; renderMain(false, 'step3'); },
    'm3-twist'(el) { if (S.m3.tdone) return; S.m3.twist = Number(el.dataset.i); renderMain(false); },
    'm3-tsubmit'() {
      const st = S.m3;
      if (st.tdone || st.twist == null) return;
      st.tdone = true;
      complete('m3');
      award('m3t', st.twist === 0 ? 4 : 0);
      renderMain(false, 'step3');
    },

    /* MISSION 4 */
    'm4-answer'() { S.m4.phase = 'brief'; renderMain(true); },
    'm4-start'() { S.m4.phase = 'judge'; S.m4.idx = 0; renderMain(true); },
    'm4-dec'(el) { if (S.m4.phase !== 'judge') return; S.m4.ans[S.m4.idx].d = Number(el.dataset.i); renderMain(false); },
    'm4-reason'(el) { if (S.m4.phase !== 'judge') return; S.m4.ans[S.m4.idx].r = Number(el.dataset.i); renderMain(false); },
    'm4-submit'() {
      const a = S.m4.ans[S.m4.idx];
      if (S.m4.phase !== 'judge' || a.d == null || a.r == null) return;
      S.m4.phase = 'discuss';
      S.m4.remain = DISCUSS_SEC;
      S.m4.total = DISCUSS_SEC;
      S.m4.ended = false;
      renderMain(true);
    },
    'm4-add'() {
      S.m4.remain += 10;
      S.m4.total = Math.max(S.m4.total, S.m4.remain);
      S.m4.ended = false;
      renderMain(false);
    },
    'm4-reveal'() {
      if (S.m4.phase !== 'discuss') return;
      const c = CASES[S.m4.idx], a = S.m4.ans[S.m4.idx];
      const ansI = c.answer;
      award('m4' + c.id, (a.d === ansI ? c.dpts : 0) + (c.reasons[a.r].ok ? 5 : 0));
      S.m4.phase = 'reveal';
      renderMain(true);
    },
    'm4-next'() {
      if (S.m4.idx < CASES.length - 1) {
        S.m4.idx += 1;
        S.m4.phase = 'judge';
        renderMain(true);
      } else {
        S.m4.phase = 'summary';
        S.m4.idx = CASES.length;
        complete('m4');
        renderMain(true);
      }
    },

    /* MISSION 5 */
    'm5-toggle'(el) { if (S.m5.done) return; toggle(S.m5.sel, el.dataset.k); renderMain(false); },
    'm5-submit'() {
      const st = S.m5;
      if (st.done || !st.sel.size) return;
      st.done = true;
      let s = 0;
      M5_OPTS.forEach((o) => { if (st.sel.has(o.k)) s += o.good ? 2 : -2; });
      award('m5s', clamp(s, 0, 10));
      renderMain(false);
    },
    'm5-house'() { S.m5.step = 2; renderMain(true); },
    'm5-room'(el) { S.m5.room = el.dataset.k; renderMain(false, mq('(max-width: 900px)') ? 'scenePanel' : null); },
    'm5-pick'(el) {
      const k = S.m5.room;
      if (!k) return;
      if (!S.m5.scene[k]) S.m5.scene[k] = { pick: null, done: false };
      const r = S.m5.scene[k];
      if (r.done) return;
      r.pick = Number(el.dataset.i);
      renderMain(false);
    },
    'm5-check'() {
      const k = S.m5.room, r = S.m5.scene[k];
      if (!r || r.pick == null || r.done) return;
      r.done = true;
      const allDone = SCENES.every((s) => S.m5.scene[s.k] && S.m5.scene[s.k].done);
      if (allDone && !S.m5.sdone) {
        S.m5.sdone = true;
        const correct = SCENES.filter((s) => s.opts[S.m5.scene[s.k].pick].ok).length;
        reveal(['dc_plan']);
        renderChart();
        complete('m5');
        award('m5h', [0, 2, 3, 5][correct]);
      }
      renderMain(false);
    },
  };

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = A[el.dataset.act];
    if (fn) { e.preventDefault(); fn(el); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (t && t.dataset && t.dataset.input === 'name') {
      S.name = t.value.slice(0, 16);
      const b = $('#badgeName'); if (b) b.textContent = S.name.trim() || '신입 작업치료사';
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && $('#modalBack')) closeModal();
  });

  /* ================= 시작 ================= */
  renderAll(true);
  setInterval(tick, 250);
})();
</script>
</body>
</html>
